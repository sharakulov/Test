$.querySelector(".q").textContent=x.q;if(x.orig.ctx)document.getElementById("cx").innerHTML="<div class=ctx>"+CTX[x.orig.ctx]+"</div>";const os=document.getElementById("os");let done=false;
x.o.forEach((o,k)=>{const b=document.createElement("button");b.textContent="ABCD"[k]+")  "+o.t;b.onclick=()=>{if(done)return;done=true;
[...os.children].forEach((c,m)=>{if(x.o[m].c)c.classList.add("ok")});
if(o.c)s++;else{b.classList.add("no");w.push(x.orig)}
const n=document.getElementById("nx"),nb=document.createElement("button");nb.className="p";nb.textContent=i+1<Q.length?"Келесі →":"Нәтиже";nb.onclick=()=>{i++;i<Q.length?show():end()};n.appendChild(nb);nb.scrollIntoView({block:"nearest"})};os.appendChild(b)})}
function end(){const p=Math.round(s/Q.length*100);$.innerHTML=`<div class=c>Нәтиже</div><div class=big>${s} / ${Q.length}</div><div class=c style="margin-bottom:20px">${p}% ${p>=80?"🎉":p>=50?"👍":"💪"}</div>`;
const a=document.createElement("button");a.className="p";a.textContent="Басынан бастау (барлық сұрақ)";a.onclick=()=>start(D);$.appendChild(a);
if(w.length){const b=document.createElement("button");b.textContent="Қателерді қайталау ("+w.length+")";b.onclick=()=>start(w);$.appendChild(b)}}
function home(){$.innerHTML=`<h2>Арнайы пән тест</h2><p>${D.length} сұрақ. Сұрақтар мен жауаптар әр жолы араласады.</p>`;const b=document.createElement("button");b.className="p";b.textContent="Бастау";b.onclick=()=>start(D);$.appendChild(b)}
home();
</script></body></html>
